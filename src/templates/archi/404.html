{% extends 'archi/base.html' %}

{% block title %}Page non trouvée (404){% endblock %}

{% block content %}
<section class="archi-container archi-container--narrow archi-404">
    <div>
        <p class="archi-404__code">404</p>
        <p style="font-size:var(--text-lg);color:var(--color-ink-soft);margin:var(--space-md) 0 var(--space-lg);">
            La page que vous recherchez n'existe pas.
        </p>
        <a href="{% url 'archi:home' %}" class="archi-btn archi-btn--primary">Retour à l'accueil</a>
    </div>
</section>
{% endblock %}
