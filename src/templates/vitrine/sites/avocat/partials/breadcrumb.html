{% load vitrine_tags %}{% site_url 'home' as accueil_url %}
<nav class="fil" aria-label="Fil d'Ariane">
    <ol>
        <li><a href="{{ accueil_url }}">Accueil</a></li>
        {% if parent_label %}<li><a href="{{ parent_url }}">{{ parent_label }}</a></li>{% endif %}
        <li aria-current="page">{{ current }}</li>
    </ol>
</nav>
{% with base=request.scheme|add:"://"|add:request.get_host %}
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Accueil", "item": "{{ base }}{{ accueil_url }}"},
    {% if parent_label %}{"@type": "ListItem", "position": 2, "name": "{{ parent_label|escapejs }}", "item": "{{ base }}{{ parent_url }}"},{% endif %}
    {"@type": "ListItem", "position": {% if parent_label %}3{% else %}2{% endif %}, "name": "{{ current|escapejs }}", "item": "{{ request.build_absolute_uri }}"}
]}
</script>
{% endwith %}
