{# Particulier (TTC) / Entreprise (HT). Caché sans JavaScript : les montants restent affichés TTC. #}
<div class="taxe" role="group" aria-label="Afficher les honoraires pour" data-taxe-toggle hidden>
    <button type="button" class="taxe__btn" data-taxe="ttc" aria-pressed="true">Particulier <span>TTC</span></button>
    <button type="button" class="taxe__btn" data-taxe="ht" aria-pressed="false">Entreprise <span>HT</span></button>
</div>
